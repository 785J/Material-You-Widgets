name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Lint
        run: ./gradlew :app:lintDebug

      - name: Build release (unsigned when no signing env)
        run: ./gradlew :app:assembleRelease
        env:
          MW_KEYSTORE_FILE: ${{ secrets.MW_KEYSTORE_FILE }}
          MW_KEYSTORE_PASSWORD: ${{ secrets.MW_KEYSTORE_PASSWORD }}
          MW_KEY_ALIAS: ${{ secrets.MW_KEY_ALIAS }}
          MW_KEY_PASSWORD: ${{ secrets.MW_KEY_PASSWORD }}

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk
